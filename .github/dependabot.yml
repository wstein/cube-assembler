version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; npm ci fails
      # with TypeScript 7 until it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      github-actions:
        patterns: ["*"]
